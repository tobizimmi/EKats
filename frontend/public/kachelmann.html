<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kachelmann – EKats</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#14232f" />
</head>
<body data-addon-source="kachelmann">
  <div id="app-sidebar-root"></div>
  <main>
    <div class="dashboard-grid">
      <div id="map"></div>
      <div class="card stack">
        <h2 class="section-title">Kachelmann – Aktuelles Wetter</h2>
        <p class="muted" id="list-updated"></p>
        <p class="error-message" id="addon-error" role="alert"></p>
        <div id="addon-table-container"></div>
        <div class="detail-panel" id="detail-panel" hidden>
          <h3 class="section-title">Details</h3>
          <dl id="detail-content"></dl>
        </div>
      </div>
    </div>
    <p class="attribution">
      Quelle: Kachelmannwetter/Meteologix (optionale, kostenpflichtige Zusatzquelle - Zugriff je
      nach Freigabe im Admin-Bereich, siehe Einstellungen).
    </p>
  </main>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/header.js"></script>
  <script src="js/severity.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/gebiet-info.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/pegel-chart.js"></script>
  <script src="js/bundesland.js"></script>
  <script src="js/data-table.js"></script>
  <script src="js/addon.js"></script>
</body>
</html>
