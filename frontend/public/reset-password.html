<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passwort zurücksetzen – EKats</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#14232f" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1>Neues Passwort festlegen</h1>
      <p class="error-message" id="reset-password-missing-token" role="alert" hidden>
        Kein gültiger Reset-Link. Bitte den Link erneut über
        <a href="forgot-password.html">„Passwort vergessen“</a> anfordern.
      </p>
      <form id="reset-password-form" novalidate>
        <label>
          <span>Neues Passwort</span>
          <input type="password" id="new-password" name="newPassword" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          <span>Neues Passwort bestätigen</span>
          <input type="password" id="new-password-confirm" name="newPasswordConfirm" autocomplete="new-password" minlength="8" required />
        </label>
        <p class="error-message" id="reset-password-error" role="alert"></p>
        <button type="submit" class="primary" id="reset-password-submit">Passwort setzen</button>
      </form>
      <p class="muted">
        <a href="login.html">Zurück zur Anmeldung</a>
      </p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
