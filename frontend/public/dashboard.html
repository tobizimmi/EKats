<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mein Dashboard – EKats</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/gridstack/gridstack.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#14232f" />
</head>
<body>
  <div id="app-sidebar-root"></div>
  <main class="stack">
    <div class="card">
      <div class="section-head-row">
        <h2 class="section-title">Mein Dashboard</h2>
        <div class="dashboard-toolbar">
          <button type="button" class="secondary" id="widget-add-button">+ Widget hinzufügen</button>
          <button type="button" class="secondary" id="dashboard-reset-button">↺ Zurücksetzen</button>
        </div>
      </div>
      <p class="muted">
        Eigene Auswahl, Position und Größe der Widgets - geräteübergreifend gespeichert. Am
        Griff-Symbol (⠿) ziehen zum Verschieben, an der Kachel-Ecke ziehen zum Größenändern.
      </p>
      <div class="grid-stack" id="dashboard-grid"></div>
    </div>
  </main>

  <dialog id="widget-add-dialog" class="app-dialog">
    <form id="widget-add-form" method="dialog">
      <h3 class="section-title">Widget hinzufügen</h3>
      <label>
        <span>Widget-Typ</span>
        <select id="widget-add-type"></select>
      </label>
      <label id="widget-add-pegel-row" hidden>
        <span>Pegel-Station</span>
        <select id="widget-add-pegel-station"></select>
      </label>
      <label id="widget-add-waldbrand-row" hidden>
        <span>Waldbrand-Station</span>
        <select id="widget-add-waldbrand-station"></select>
      </label>
      <p class="error-message" id="widget-add-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="submit" class="primary">Hinzufügen</button>
        <button type="button" class="secondary" id="widget-add-cancel">Abbrechen</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/gridstack/gridstack-all.js"></script>
  <script src="js/api.js"></script>
  <script src="js/header.js"></script>
  <script src="js/severity.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/pegel-chart.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
