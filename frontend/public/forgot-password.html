<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passwort vergessen – EKats</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#14232f" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1>Passwort vergessen</h1>
      <p class="muted">
        E-Mail-Adresse eingeben - falls ein Konto existiert, verschicken wir einen Link zum
        Zurücksetzen (gültig 1 Stunde).
      </p>
      <form id="forgot-password-form" novalidate>
        <label>
          <span>E-Mail</span>
          <input type="email" id="email" name="email" autocomplete="username" required />
        </label>
        <p class="error-message" id="forgot-password-error" role="alert"></p>
        <p class="muted" id="forgot-password-success" role="status" hidden>
          Falls ein Konto mit dieser E-Mail existiert, wurde eine E-Mail mit einem Reset-Link
          verschickt. Bitte auch den Spam-Ordner prüfen.
        </p>
        <button type="submit" class="primary" id="forgot-password-submit">Link anfordern</button>
      </form>
      <p class="muted">
        <a href="login.html">Zurück zur Anmeldung</a>
      </p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
