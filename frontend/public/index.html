<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lagedashboard – EKats</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#14232f" />
</head>
<body>
  <div id="offline-banner" hidden></div>
  <header class="app-header">
    <div class="brand">🚒 EKats Lagedashboard</div>
    <nav>
      <a href="./">Karte</a>
      <a href="settings.html">Einstellungen</a>
      <a href="admin.html" data-role="admin-only" hidden>Admin</a>
      <span id="header-user" class="muted"></span>
      <button id="logout-button" type="button">Abmelden</button>
    </nav>
  </header>
  <main>
    <div class="layer-toggle-bar" id="layer-toggles"></div>
    <button id="add-object-button" type="button" class="secondary" data-role="stab-only" hidden>
      Objekt anlegen
    </button>
    <div class="dashboard-grid">
      <div id="map"></div>
      <div class="card stack">
        <div>
          <h2 class="section-title">Lage-Übersicht</h2>
          <p class="muted" id="list-updated"></p>
          <ul class="situation-list" id="situation-list"></ul>
        </div>
        <div class="detail-panel" id="detail-panel" hidden>
          <h3 class="section-title">Details</h3>
          <dl id="detail-content"></dl>
        </div>
      </div>
    </div>
    <p class="attribution">
      Quellen: DWD (Wetterwarnungen, Waldbrandgefahrenindex), Wasserstraßen- und Schifffahrtsverwaltung
      des Bundes (PEGELONLINE), Hochwasserzentralen der Länder, NASA FIRMS (LANCE, NASA/GSFC).
    </p>
  </main>

  <dialog id="object-dialog" class="app-dialog">
    <form id="object-form" method="dialog">
      <h3 id="object-dialog-title" class="section-title">Objekt</h3>
      <label>
        <span>Name</span>
        <input id="object-name" type="text" required maxlength="200" />
      </label>
      <label>
        <span>Kategorie</span>
        <select id="object-category">
          <option value="schule_kita">Schule/Kita</option>
          <option value="krankenhaus_pflege">Krankenhaus/Pflegeeinrichtung</option>
          <option value="industrie_gefahrstoff">Industrie/Gefahrstoffbetrieb</option>
          <option value="versammlungsstaette">Versammlungsstätte</option>
          <option value="sonstiges" selected>Sonstiges</option>
        </select>
      </label>
      <label>
        <span>Adresse</span>
        <input id="object-address" type="text" maxlength="300" />
      </label>
      <label>
        <span>Besondere Gefahren</span>
        <textarea id="object-hazards" rows="2" maxlength="2000"></textarea>
      </label>
      <label>
        <span>Zufahrt / Schlüsseldepot</span>
        <textarea id="object-access-info" rows="2" maxlength="2000"></textarea>
      </label>
      <label>
        <span>Ansprechpartner Name</span>
        <input id="object-contact-name" type="text" maxlength="200" />
      </label>
      <label>
        <span>Ansprechpartner Telefon</span>
        <input id="object-contact-phone" type="text" maxlength="50" />
      </label>
      <label>
        <span>Sonstige Hinweise</span>
        <textarea id="object-notes" rows="2" maxlength="2000"></textarea>
      </label>
      <p class="error-message" role="alert"></p>
      <div class="dialog-actions">
        <button id="object-delete-button" type="button" class="secondary" hidden>Löschen</button>
        <button id="object-cancel-button" type="button" class="secondary">Abbrechen</button>
        <button id="object-save-button" type="submit" class="primary">Speichern</button>
      </div>
    </form>
  </dialog>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/header.js"></script>
  <script src="js/severity.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/map.js"></script>
  <script src="js/list.js"></script>
  <script src="js/objects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
